[build]
  base = "frontend"
  command = "npm run build"
  publish = "dist"

[context.production.environment]
  VITE_API_URL = "https://student-management-api-9ccy.onrender.com"

[[redirects]]
  from = "/api/*"
  to = "https://student-management-api-9ccy.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
